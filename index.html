<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f1e8; --paper:#fffdf8; --ink:#4a3b30; --sub:#8a7666; --line:#eadfce;
  --tea:#c9a27e; --tea-d:#a87e5a; --cream:#fbf5ea;
  --kh:#e9967a; --kh-bg:#fcebe3;   /* 高雄 珊瑚 */
  --tn:#d9a441; --tn-bg:#fbf1d9;   /* 台南 芥黃 */
  --pt:#7fae8f; --pt-bg:#e5f1e8;   /* 屏東 抹茶 */
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",sans-serif;line-height:1.65;
  background-image:radial-gradient(#eadcc8 1px,transparent 1px);background-size:22px 22px}
.wrap{max-width:760px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
.h{font-family:"Huninn","Noto Sans TC",sans-serif;font-weight:400}

/* header */
.hero{position:relative;background:var(--paper);border-radius:28px;padding:26px 22px 22px;border:1.5px solid var(--line);overflow:hidden}
.hero svg.flags{position:absolute;top:0;left:0;width:100%;height:34px}
.hero .kicker{margin-top:14px;font-size:13px;color:var(--sub);letter-spacing:.12em}
.hero h1{margin:4px 0 6px;font-size:30px;line-height:1.3}
.hero .week{display:inline-block;background:var(--tea);color:#fff;border-radius:999px;padding:3px 14px;font-size:15px}
.updrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.updrow .upd{margin:0}
.reload{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:6px 14px 6px 8px;
 background:linear-gradient(135deg,#fbe9dc,#f6dcc6);color:#8a5a3c;font-family:"Huninn","Noto Sans TC",sans-serif;font-size:13.5px;cursor:pointer;
 box-shadow:0 2px 0 #e7c7aa,inset 0 0 0 1.5px #f1d2b8;transition:transform .15s}
.reload:active{transform:translateY(2px);box-shadow:0 0 0 #e7c7aa,inset 0 0 0 1.5px #f1d2b8}
.reload svg{width:22px;height:22px;background:#fffdf8;border-radius:50%;padding:3px;color:#c98b55}
.reload.spin svg{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;background:#4a3b30;color:#fff;
 padding:9px 18px;border-radius:999px;font-size:14px;transition:.3s;pointer-events:none;z-index:20;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.reload-old{margin-left:10px;border:1.5px solid var(--line);background:var(--cream);color:var(--ink);border-radius:999px;padding:3px 12px;font-size:12.5px;font-family:inherit;cursor:pointer}
.hero .upd{font-size:12px;color:var(--sub);margin-top:8px}
.hero .note{margin-top:14px;background:var(--cream);border-radius:16px;padding:12px 14px;font-size:14.5px;display:flex;gap:10px}
.hero .note .bean{flex:0 0 38px}
.hero .deco{position:absolute;right:12px;top:30px;width:78px;opacity:.95}
@media(max-width:480px){.hero h1{font-size:25px}.hero .kicker{padding-right:70px}.hero .deco{width:64px;top:34px}}

/* filters */
.bar{position:sticky;top:env(safe-area-inset-top);z-index:5;background:rgba(247,241,232,.92);backdrop-filter:blur(6px);padding:12px 0 10px;margin-top:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.kh.on{background:var(--kh);border-color:var(--kh)}
.chip.tn.on{background:var(--tn);border-color:var(--tn)}
.chip.pt.on{background:var(--pt);border-color:var(--pt)}
.chips.sm{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.chips.sm::-webkit-scrollbar{display:none}
.chips.sm .chip{font-size:13px;padding:4px 12px;white-space:nowrap;flex:0 0 auto}
.count{font-size:12.5px;color:var(--sub);margin-top:6px}

/* section */
.sec{margin-top:26px}
.sec-t{display:flex;align-items:center;gap:8px;font-size:21px;margin:0 0 12px}
.sec-t small{font-family:"Noto Sans TC";font-size:13px;color:var(--sub)}

/* picks */
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pick{background:var(--paper);border:1.5px solid var(--line);border-radius:20px;padding:14px 12px;cursor:pointer;text-align:left;font-family:inherit;color:inherit}
.pick .e{font-size:30px}
.pick .t{font-weight:700;font-size:14.5px;line-height:1.4;margin-top:4px}
.pick .d{font-size:12px;color:var(--sub);margin-top:4px}
@media(max-width:560px){.picks{grid-template-columns:1fr}.pick{display:flex;gap:12px;align-items:center}.pick .e{font-size:28px}}

/* cards */
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:24px;padding:18px 18px 14px;margin-bottom:14px;position:relative;scroll-margin-top:90px}
.card.flash{animation:fl 1.4s}
@keyframes fl{0%{box-shadow:0 0 0 4px var(--tea)}100%{box-shadow:0 0 0 0 transparent}}
.top{display:flex;gap:12px;align-items:flex-start}
.emo{flex:0 0 52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:28px}
.kh .emo{background:var(--kh-bg)} .tn .emo{background:var(--tn-bg)} .pt .emo{background:var(--pt-bg)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.tag{font-size:12px;border-radius:999px;padding:1px 10px;background:var(--cream);color:var(--sub);white-space:nowrap}
.tag.city{color:#fff}
.kh .tag.city{background:var(--kh)} .tn .tag.city{background:var(--tn)} .pt .tag.city{background:var(--pt)}
.tag.free{background:#e7f2e3;color:#4f7a4a}
.tag.signup{background:#fde7e1;color:#b2533b}
.tag.night{background:#e6e6f4;color:#5a5a8c}
.tag.hot{background:#b5534a;color:#fff}
.card h3{margin:0;font-size:18.5px;line-height:1.4;font-weight:700}
.info{margin:12px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:14.5px}
.info dt{color:var(--sub);white-space:nowrap}
.info dd{margin:0;min-width:0}
.addr{font-size:13px;color:var(--sub)}
.info a{color:var(--tea-d)}
.pts{margin:12px 0 0;padding:0;list-style:none;font-size:14.5px}
.pts li{position:relative;padding-left:18px;margin:3px 0}
.pts li:before{content:"";position:absolute;left:3px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--tea)}
.tip{margin-top:12px;background:var(--cream);border-radius:14px;padding:9px 12px;font-size:14px}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:12.5px;color:var(--sub);flex-wrap:wrap}
.foot a{color:var(--sub)}
.btn{display:inline-flex;align-items:center;gap:4px;border-radius:999px;background:var(--ink);color:#fff !important;text-decoration:none;padding:5px 14px;font-size:13px}
.today .card{border:2px solid #e9c99b;background:#fffaf0}
.ex .emo{background:#f3ece1}.tag.left{background:#fdeee8;color:#b2533b}
.tw .emo{background:#efe8f3}.tw .tag.city{background:#9a86b0}
.empty{text-align:center;color:var(--sub);padding:30px 0}

/* always */
.al{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:620px){.al{grid-template-columns:1fr}}
.ac{background:var(--paper);border:1.5px dashed var(--line);border-radius:20px;padding:14px}
.ac .t{font-weight:700;margin:4px 0}
.ac p{margin:0;font-size:13.5px}
.ac .lk{margin-top:8px;font-size:12.5px;display:flex;gap:12px}
.ac .lk a{color:var(--tea-d)}

.end{margin-top:30px;text-align:center;font-size:12.5px;color:var(--sub)}
.end svg{width:120px;display:block;margin:0 auto 6px}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero">
    <svg class="flags" viewBox="0 0 760 34" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 4 Q380 26 760 4" stroke="#c9a27e" stroke-width="1.5" fill="none"/>
      <g id="fl"></g>
    </svg>
    <svg class="deco" viewBox="0 0 120 110" aria-hidden="true">
      <circle cx="88" cy="26" r="16" fill="#f6d28b"/>
      <path d="M8 96 Q30 60 52 96Z" fill="#cfe2c9"/>
      <path d="M40 96 Q70 50 104 96Z" fill="#b9d4b3"/>
      <rect x="18" y="68" width="34" height="28" rx="3" fill="#fff" stroke="#c9a27e" stroke-width="2"/>
      <path d="M14 70 L35 52 L56 70Z" fill="#e9967a"/>
      <rect x="30" y="80" width="10" height="16" rx="2" fill="#c9a27e"/>
      <path d="M0 97 H120" stroke="#c9a27e" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <div class="kicker">高雄・台南・屏東　親子週末情報</div>
    <h1 class="h">紅豆家・週末去哪玩</h1>
    <span class="week h" id="week">—</span>
    <div class="updrow"><span class="upd" id="upd"></span>
      <button class="reload" id="reloadBtn" aria-label="重新整理">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M19.8 3.8v4.6h-4.6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.2" fill="#e9967a"/></svg>
        <span>重新整理</span>
      </button></div>
    <div class="note">
      <svg class="bean" viewBox="0 0 40 40" aria-hidden="true">
        <ellipse cx="20" cy="21" rx="15" ry="13" fill="#b5534a"/>
        <ellipse cx="14" cy="16" rx="4" ry="2.5" fill="#d9847b"/>
        <circle cx="15" cy="22" r="1.6" fill="#3b2a20"/><circle cx="25" cy="22" r="1.6" fill="#3b2a20"/>
        <path d="M17 26 Q20 28.5 23 26" stroke="#3b2a20" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        <path d="M20 8 Q23 3 27 5" stroke="#7fae8f" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
      <div id="note"></div>
    </div>
  </header>

  <section class="sec today" id="todaySec" style="display:none">
    <h2 class="sec-t h">🌙 <span id="todayLabel"></span> <small id="todayNote"></small></h2>
    <div id="todayList"></div>
  </section>

  <section class="sec">
    <h2 class="sec-t h">⭐ 這週末最推薦 <small>點一下直接跳過去</small></h2>
    <div class="picks" id="picks"></div>
  </section>

  <div class="bar">
    <div class="chips" id="cityChips">
      <button class="chip on" data-c="全部">全部</button>
      <button class="chip kh" data-c="高雄">高雄</button>
      <button class="chip tn" data-c="台南">台南</button>
      <button class="chip pt" data-c="屏東">屏東</button>
    </div>
    <div class="chips sm" id="optChips" style="margin-top:8px">
      <button class="chip" data-o="free">💰 只看免費</button>
      <button class="chip" data-o="night">🌙 傍晚也能去</button>
      <button class="chip" data-o="sat">週六有</button>
      <button class="chip" data-o="sun">週日有</button>
    </div>
    <div class="count" id="count"></div>
  </div>

  <section class="sec" style="margin-top:8px">
    <div id="list"></div>
  </section>

  <section class="sec" id="exSec" style="display:none">
    <h2 class="sec-t h">🖼️ 南部展覽 <small>展期比較長，有空慢慢去</small></h2>
    <div id="exList"></div>
  </section>

  <section class="sec" id="twSec" style="display:none">
    <h2 class="sec-t h">🗾 全台最推薦 Top 3 <small>想出遠門的參考</small></h2>
    <div id="twList"></div>
  </section>

  <section class="sec">
    <h2 class="sec-t h">🏠 隨時都能去的放電好地方 <small>沒活動也不怕</small></h2>
    <div class="al" id="always"></div>
  </section>

  <div class="end">
    <svg viewBox="0 0 120 30" aria-hidden="true">
      <path d="M4 22 Q30 6 60 18 T116 14" stroke="#c9a27e" stroke-width="1.5" fill="none" stroke-dasharray="3 5" stroke-linecap="round"/>
      <circle cx="116" cy="14" r="4" fill="#e9967a"/>
    </svg>
    每週一早上自動更新 ・ 活動時間可能臨時異動，出發前請點「資料來源」再確認一次喔
  </div>
</div>

<script>
// bunting flags
(function(){const g=document.getElementById('fl');const cols=['#e9967a','#d9a441','#7fae8f','#c9a27e'];let h='';
for(let i=0;i<19;i++){const x=20+i*38;const y=4+22*Math.sin(Math.PI*x/760)*0.75;h+=`<path d="M${x-9} ${y} L${x+9} ${y} L${x} ${y+14}Z" fill="${cols[i%4]}" opacity=".85"/>`;}g.innerHTML=h;})();

const cls={'高雄':'kh','台南':'tn','屏東':'pt'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mapUrl=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
let D=null, city='全部', opts=new Set();

function hasDay(e,day){return (e.days||['sat','sun']).includes(day);}
function placeHtml(p){p=esc(p);const i=p.indexOf('（');return i>0?p.slice(0,i)+'<br><span class="addr">'+p.slice(i+1).replace(/）$/,'')+'</span>':p;}
function card(e,tw,ex){
  const c=tw?'tw':(cls[e.city]||'kh')+(ex?' ex':'');
  const tags=[`<span class="tag city">${esc(e.city)}</span>`];
  if(ex&&e.end){const n=Math.ceil((new Date(e.end+'T23:59:59+08:00')-Date.now())/864e5); if(e.end>='2099') tags.push('<span class="tag">常設展</span>'); else if(n<=21) tags.push(`<span class="tag left">剩 ${n} 天</span>`);}
  if(e.hot) tags.push(`<span class="tag hot">${esc(e.hot)}</span>`);
  if(e.free) tags.push('<span class="tag free">免費</span>');
  if(e.signup) tags.push('<span class="tag signup">要先報名/登記</span>');
  if(e.night) tags.push('<span class="tag night">傍晚以後也精彩</span>');
  return `<article class="card ${c}" id="${esc(e.id)}">
    <div class="top"><div class="emo">${esc(e.emoji)}</div>
      <div><div class="tags">${tags.join('')}</div><h3>${esc(e.title)}</h3></div></div>
    <dl class="info">
      <dt>📅 日期</dt><dd>${esc(e.date)}</dd>
      <dt>⏰ 時間</dt><dd>${esc(e.time)}</dd>
      <dt>📍 地點</dt><dd>${placeHtml(e.place)}<br><a href="${mapUrl(e.map||e.place)}" target="_blank" rel="noopener">在地圖上打開 ↗</a></dd>
      <dt>💰 費用</dt><dd>${esc(e.cost)}</dd>
      <dt>👶 年齡</dt><dd>${esc(e.kids)}</dd>
    </dl>
    <ul class="pts">${(e.points||[]).map(p=>`<li>${esc(p)}</li>`).join('')}</ul>
    ${e.tip?`<div class="tip">💡 ${esc(e.tip).replace(/\n/g,'<br>')}</div>`:''}
    <div class="foot"><span>資料來源：${esc(e.srcName||'')}</span><a class="btn" href="${esc(e.src)}" target="_blank" rel="noopener">看詳細資訊 ↗</a></div>
  </article>`;
}
function render(){
  let L=D.events.filter(e=>city==='全部'||e.city===city);
  if(opts.has('free')) L=L.filter(e=>e.free);
  if(opts.has('night')) L=L.filter(e=>e.night);
  if(opts.has('sat')) L=L.filter(e=>hasDay(e,'sat'));
  if(opts.has('sun')) L=L.filter(e=>hasDay(e,'sun'));
  const order={'高雄':0,'台南':1,'屏東':2};
  L.sort((a,b)=>(order[a.city]-order[b.city]));
  document.getElementById('list').innerHTML=L.length?L.map(card).join(''):'<div class="empty">這個條件下沒有活動，換個篩選看看 🌱</div>';
  document.getElementById('count').textContent=`共 ${L.length} 個活動`;
  const today=new Date(Date.now()+8*3600e3).toISOString().slice(0,10);
  const X=(D.exhibits||[]).filter(e=>(!e.end||e.end>=today)&&(city==='全部'||e.city===city)).sort((a,b)=>(a.end||'').localeCompare(b.end||''));
  document.getElementById('exSec').style.display=(D.exhibits||[]).length?'':'none';
  document.getElementById('exList').innerHTML=X.length?X.map(e=>card(e,false,true)).join(''):'<div class="empty">這個縣市目前沒有收錄展覽 🌱</div>';
}
function init(d){
  D=d;
  document.getElementById('week').textContent=d.week;
  document.getElementById('upd').textContent='更新於 '+d.updated;
  document.getElementById('note').innerHTML=esc(d.note||'').replace(/\n/g,'<br>');
  const byId=Object.fromEntries(d.events.map(e=>[e.id,e]));
  document.getElementById('picks').innerHTML=(d.picks||[]).map(id=>byId[id]).filter(Boolean).map(e=>
    `<button class="pick" data-id="${esc(e.id)}"><div class="e">${esc(e.emoji)}</div><div><div class="t">${esc(e.title)}</div><div class="d">${esc(e.city)}・${esc(e.cost)}</div></div></button>`).join('');
  document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{
    city='全部';opts.clear();syncChips();render();
    const el=document.getElementById(b.dataset.id); if(el){el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');}
  });
  document.getElementById('always').innerHTML=(d.always||[]).map(a=>`<div class="ac ${cls[a.city]||''}">
    <span class="tag" style="background:var(--${cls[a.city]}-bg)">${esc(a.city)}</span>
    <div class="t">${esc(a.emoji)} ${esc(a.title)}</div><p>${esc(a.desc)}</p>
    <div class="lk"><a href="${mapUrl(a.map||a.title)}" target="_blank" rel="noopener">地圖 ↗</a><a href="${esc(a.src)}" target="_blank" rel="noopener">介紹 ↗</a></div></div>`).join('');
  const td=d.today, now=new Date(Date.now()+8*3600e3).toISOString().slice(0,10);
  if(td && td.date===now && (td.items||[]).length){
    document.getElementById('todaySec').style.display='';
    document.getElementById('todayLabel').textContent=td.label||'今天還能去';
    document.getElementById('todayNote').textContent=td.note||'';
    document.getElementById('todayList').innerHTML=td.items.map(card).join('');
  }
  if((d.national||[]).length){
    document.getElementById('twSec').style.display='';
    document.getElementById('twList').innerHTML=d.national.map(e=>card(e,true)).join('');
  }
  render();
}
function syncChips(){
document.querySelectorAll('#cityChips .chip').forEach(x=>x.classList.toggle('on',x.dataset.c===city));
  document.querySelectorAll('#optChips .chip').forEach(x=>x.classList.toggle('on',opts.has(x.dataset.o)));
}
document.querySelectorAll('#cityChips .chip').forEach(b=>b.onclick=()=>{city=b.dataset.c;syncChips();render();});
document.querySelectorAll('#optChips .chip').forEach(b=>b.onclick=()=>{const o=b.dataset.o;opts.has(o)?opts.delete(o):opts.add(o);syncChips();render();});

function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(window._tt);window._tt=setTimeout(()=>el.classList.remove('on'),2200);}
const BUILD='202611090826';
const LOADED=Date.now();
async function checkNew(manual){
  const b=document.getElementById('reloadBtn'); if(manual) b.classList.add('spin');
  try{
    const j=await (await fetch('events.json?v='+Date.now(),{cache:'no-store'})).json();
    let newBuild=false;
    try{const t=await (await fetch('index.html?v='+Date.now(),{cache:'no-store'})).text();const m=t.match(/const BUILD='(\d+)'/);newBuild=!!(m&&m[1]!==BUILD);}catch(_){}
    const changed=newBuild||!D||j.updated!==D.updated||JSON.stringify(j).length!==JSON.stringify(D).length;
    if(manual&&!changed){setTimeout(()=>{b.classList.remove('spin');toast('已經是最新的囉 🌿');},500);return;}
    if(changed){ if(manual) toast('更新好了 ✨'); setTimeout(()=>location.replace(location.pathname+'?r='+Date.now()),manual?600:0); }
  }catch(e){ if(manual){b.classList.remove('spin');toast('網路好像不太穩，等一下再試試');} }
}
document.getElementById('reloadBtn').onclick=()=>checkNew(true);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&Date.now()-LOADED>10*60e3) checkNew(false); });
fetch('events.json?v='+Date.now()).then(r=>r.json()).then(init).catch(()=>{
  document.getElementById('list').innerHTML='<div class="empty">資料載入失敗，請重新整理頁面 🙏</div>';
});
</script>
<div class="toast" id="toast"></div>
</body>
</html>
